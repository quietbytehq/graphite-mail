# Release build: on a version tag (v1.11.0), run the tests, build the Linux .deb and the Windows installer on their own
# runners, and attach both to a DRAFT release. Nothing is published until someone presses "Publish" on GitHub.
# The snap is built as well and uploaded to the Snap Store's stable channel (that one goes live at once).
#
# The Google OAuth client secret is deliberately NOT available here: these builds have no Google sign-in (the app says
# "Google sign-in coming soon" and offers Gmail with an app password). A Gmail-enabled build is made locally. Every
# build job fails if the string GOCSPX (the prefix of every Google client secret) is found in what it built.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Manual runs (any branch) build and test without making a release: there is no tag to attach to. The snap is
  # uploaded to the store's edge channel for testing (`sudo snap install graphite-mail --edge`), or only attached to
  # the run when "none" is chosen.
  workflow_dispatch:
    inputs:
      snap_channel:
        description: "Snap Store channel to upload the snap to"
        type: choice
        options: [edge, none]
        default: edge

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The two platforms are independent: a Windows failure never holds up the Linux .deb (and the other way round).
  test-linux:
    name: Tests (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: No Google secret file in the checkout
        run: test ! -f src-tauri/google_oauth.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  test-windows:
    name: Tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: NASM (needed by aws-lc-sys on Windows)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: No Google secret file in the checkout
        shell: bash
        run: test ! -f src-tauri/google_oauth.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  build-linux:
    name: Linux .deb
    needs: test-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Versions agree with the tag
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json src-tauri/tauri.conf.json; do grep -q "\"version\": \"$tag\"" "$f" || { echo "$f is not at $tag"; exit 1; }; done
          grep -q "^version = \"$tag\"" src-tauri/Cargo.toml || { echo "Cargo.toml is not at $tag"; exit 1; }
      - run: npm ci
      - name: Build the .deb
        run: npx tauri build --bundles deb
      - name: No Google client secret in the build
        run: |
          if grep -aq GOCSPX src-tauri/target/release/graphite-mail || grep -raq GOCSPX src-tauri/target/release/bundle/deb; then
            echo "A Google client secret (GOCSPX) is in the build: not releasing it."; exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    name: Windows installer
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: NASM (needed by aws-lc-sys)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - name: Build the NSIS installer (per-user, WebView2 bootstrapper)
        run: npx tauri build --bundles nsis
      - name: No Google client secret in the build
        shell: bash
        run: |
          if grep -aq GOCSPX src-tauri/target/release/graphite-mail.exe || grep -raq GOCSPX src-tauri/target/release/bundle/nsis; then
            echo "A Google client secret (GOCSPX) is in the build: not releasing it."; exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  snap:
    # The Snap Store package (snap/snapcraft.yaml), built from source by snapcraft right on the runner: Ubuntu 24.04
    # matches the snap's base (core24). A tag uploads it to the stable channel; a manual run uploads it to edge for
    # testing (or only attaches it to the run). Needs the SNAPCRAFT_STORE_CREDENTIALS secret (see README, "Snap").
    # Independent of the .deb and Windows jobs: a snap failure never holds up the draft release.
    name: Snap
    needs: test-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Versions agree with the tag
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json src-tauri/tauri.conf.json; do grep -q "\"version\": \"$tag\"" "$f" || { echo "$f is not at $tag"; exit 1; }; done
          grep -q "^version = \"$tag\"" src-tauri/Cargo.toml || { echo "Cargo.toml is not at $tag"; exit 1; }
      - name: No Google secret file in the checkout
        run: test ! -f src-tauri/google_oauth.json
      - name: Build the snap
        run: |
          sudo snap install snapcraft --classic
          sudo snapcraft pack --destructive-mode --verbosity=brief
          ls -l ./*.snap
      - name: No Google client secret in the build
        run: |
          rm -rf snap-contents
          unsquashfs -q -d snap-contents ./graphite-mail_*.snap
          if grep -raq GOCSPX snap-contents; then
            echo "A Google client secret (GOCSPX) is in the snap: not releasing it."; exit 1
          fi
          rm -rf snap-contents
      - uses: actions/upload-artifact@v5
        with:
          name: linux-snap
          path: ./*.snap
          if-no-files-found: error
      - name: Upload to the Snap Store
        if: github.ref_type == 'tag' || inputs.snap_channel == 'edge'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || 'edge' }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "The SNAPCRAFT_STORE_CREDENTIALS secret is not set; not uploading."; exit 1
          fi
          echo "Uploading to the $CHANNEL channel"
          snapcraft upload --release="$CHANNEL" ./graphite-mail_*.snap

  draft-release:
    name: Draft release
    needs: [build-linux, build-windows]
    # Waits for both build jobs and attaches whatever was built: one platform failing doesn't block the other's file.
    if: ${{ !cancelled() && github.ref_type == 'tag' && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Release notes from the changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '/^## /{p = index($0, "## " v " ") == 1 || $0 == "## " v} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Graphite Mail $tag" > notes.md
      - name: Create or update the draft release and attach the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "Graphite Mail ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
          shopt -s nullglob
          files=(artifacts/linux-deb/*.deb artifacts/windows-installer/*.exe)
          echo "Attaching: ${files[*]}"
          gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
