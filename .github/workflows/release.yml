# Release build: on a version tag (v1.11.0), run the tests, build the Linux .deb and the Windows installer on their own
# runners, and attach both to a DRAFT release. Nothing is published until someone presses "Publish" on GitHub.
#
# The Google OAuth client secret is deliberately NOT available here: these builds have no Google sign-in (the app says
# "Google sign-in coming soon" and offers Gmail with an app password). A Gmail-enabled build is made locally.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Manual runs (any branch) build and test without making a release: there is no tag to attach to.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The two platforms are independent: a Windows failure never holds up the Linux .deb (and the other way round).
  test-linux:
    name: Tests (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: No Google secret file in the checkout
        run: test ! -f src-tauri/google_oauth.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  test-windows:
    name: Tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: NASM (needed by aws-lc-sys on Windows)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: No Google secret file in the checkout
        shell: bash
        run: test ! -f src-tauri/google_oauth.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  build-linux:
    name: Linux .deb
    needs: test-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Versions agree with the tag
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json src-tauri/tauri.conf.json; do grep -q "\"version\": \"$tag\"" "$f" || { echo "$f is not at $tag"; exit 1; }; done
          grep -q "^version = \"$tag\"" src-tauri/Cargo.toml || { echo "Cargo.toml is not at $tag"; exit 1; }
      - run: npm ci
      - name: Build the .deb
        run: npx tauri build --bundles deb
      - uses: actions/upload-artifact@v5
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    name: Windows installer
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: NASM (needed by aws-lc-sys)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - name: Build the NSIS installer (per-user, WebView2 bootstrapper)
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  draft-release:
    name: Draft release
    needs: [build-linux, build-windows]
    # Waits for both build jobs and attaches whatever was built: one platform failing doesn't block the other's file.
    if: ${{ !cancelled() && github.ref_type == 'tag' && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Release notes from the changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '/^## /{p = index($0, "## " v " ") == 1 || $0 == "## " v} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Graphite Mail $tag" > notes.md
      - name: Create or update the draft release and attach the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "Graphite Mail ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
          shopt -s nullglob
          files=(artifacts/linux-deb/*.deb artifacts/windows-installer/*.exe)
          echo "Attaching: ${files[*]}"
          gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
