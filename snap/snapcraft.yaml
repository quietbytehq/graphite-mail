# The Snap Store package (snap name "graphite-mail", publisher Quiet Byte). Built the way quietbytehq/timewizer's
# snap is: strict confinement on core24 with the GNOME extension (which brings GTK 3 and the WebKitGTK 4.1 runtime
# Tauri needs), from source inside snapcraft (Node from a build snap, Rust from rustup), the version read from
# package.json. The release workflow (.github/workflows/release.yml, job "snap") packs it on an ubuntu-24.04 runner
# and uploads it to the store; `sudo snapcraft pack --destructive-mode` builds the same file on Ubuntu 24.04.
#
# This is the public build: it never has a Google client secret (no google_oauth.json, no GRAPHITE_GOOGLE_CLIENT_*
# variables), so Google sign-in says "coming soon"; Gmail works with an app password. The build fails if the string
# GOCSPX (the prefix of every Google client secret) turns up in the binary.
name: graphite-mail
title: Graphite Mail
base: core24
adopt-info: graphite-mail
summary: Offline-first mail, calendar and contacts for Microsoft 365 and Gmail
description: |
  Graphite Mail is a free, open-source mail, calendar and contacts client for Microsoft 365,
  personal Microsoft accounts (outlook.com, hotmail.com, live.com), Gmail and any IMAP
  provider (Yahoo, iCloud, Zoho, Fastmail, AOL or a custom server).

  Your mailbox is stored on this computer, in a folder you choose: read, search, reply,
  file and plan while offline, and your changes are sent when you reconnect, in order,
  with retries. Several accounts at once with an All Inboxes view, a calendar with
  invitations and Teams / Meet meetings, your organisation's directory, Outlook rules and
  Gmail filters, Bcc, signatures, attachments, drafts, six themes and keyboard shortcuts.

  No server of its own, no telemetry: the app talks to your provider directly. Sign-in
  tokens and app passwords live only in your system keyring (GNOME Keyring or KWallet).
  Because the snap is strictly confined, give it access to the keyring once:

      sudo snap connect graphite-mail:password-manager-service

  Email HTML is shown in a script-less sandbox, remote images are blocked until you allow
  them, and links open in your web browser.
license: Apache-2.0
icon: snap/gui/graphite-mail.png
website: https://github.com/quietbytehq/graphite-mail
source-code: https://github.com/quietbytehq/graphite-mail
issues: https://github.com/quietbytehq/graphite-mail/issues
contact: https://github.com/quietbytehq/graphite-mail/issues

grade: stable
confinement: strict

platforms:
  amd64:

apps:
  graphite-mail:
    command: usr/bin/graphite-mail
    extensions: [gnome]
    # The menu entry and icon are snap/gui/graphite-mail.desktop and snap/gui/graphite-mail.png (meta/gui).
    plugs:
      - network             # Microsoft Graph, Google, IMAP/SMTP
      - network-bind        # the localhost redirect that brings a browser sign-in back to the app
      - desktop             # GTK, portals, notifications, opening links in the browser
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - home                # saving attachments, importing contacts, a data folder under ~
      - removable-media     # a data folder on another drive (connect it: sudo snap connect graphite-mail:removable-media)
      - password-manager-service  # the Secret Service keyring that stores app passwords and sign-in tokens
    environment:
      # WebKitGTK starts its helper programs from a fixed path; point it inside the snap.
      WEBKIT_EXEC_PATH: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1
      # WebKit's own (bubblewrap) sandbox cannot nest inside the snap sandbox, which already confines the app.
      # Email HTML is still shown only in a script-less, sandboxed frame after DOMPurify.
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"

layout:
  /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1

parts:
  graphite-mail:
    plugin: nil
    source: .
    build-snaps:
      - node/22/stable
    build-packages:
      - build-essential
      - curl
      - file
      - pkg-config
      - libssl-dev
      - libdbus-1-dev
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - libsoup-3.0-dev
      - librsvg2-dev
      - libayatana-appindicator3-dev
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libdbus-1-3
      - shared-mime-info
    override-build: |
      set -eu
      craftctl default
      # The public build has no Google client secret: nothing may be picked up from the tree or the environment.
      test ! -f src-tauri/google_oauth.json
      unset GRAPHITE_GOOGLE_CLIENT_ID GRAPHITE_GOOGLE_CLIENT_SECRET || true
      # Rust (the snap build has network access).
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      . "$HOME/.cargo/env"
      npm ci
      npm run build
      # The same binary `tauri build` makes for the .deb (custom-protocol = the built frontend is embedded).
      cargo build --release --manifest-path src-tauri/Cargo.toml --bin graphite-mail --features tauri/custom-protocol
      if grep -aq GOCSPX src-tauri/target/release/graphite-mail; then
        echo "The binary contains a Google client secret (GOCSPX): refusing to package it." >&2
        exit 1
      fi
      install -Dm755 src-tauri/target/release/graphite-mail "$CRAFT_PART_INSTALL/usr/bin/graphite-mail"
      install -Dm644 src-tauri/icons/icon.png "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/graphite-mail.png"
      install -Dm644 src-tauri/icons/128x128.png "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/128x128/apps/graphite-mail.png"
      craftctl set version="$(node -p "require('./package.json').version")"
